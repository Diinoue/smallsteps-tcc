spring.config.import=optional:file:./backend.env[.properties]
spring.application.name=smallsteps


# Conexão com o banco de dados PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}

    # POSTGRES LOCAL
    spring.datasource.url=${LOCAL_DB_URL}
    spring.datasource.password=${DB_PASSWORD}

# SUPABASE
# spring.datasource.url=${SUPABASE_DB_URL}
# spring.datasource.password=${SUPABASE_DB_PASSWORD}
# spring.jpa.properties.hibernate.default_schema=app
# spring.datasource.hikari.connection-init-sql=SET search_path TO app



# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Execução de scripts de inicialização (schema.sql e data.sql)
spring.jpa.defer-datasource-initialization=true
    # RODAR INSERTS NO BD (SEMPRE)
    spring.sql.init.mode=always
# spring.sql.init.continue-on-error=true

# JWT
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
