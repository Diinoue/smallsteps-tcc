spring.application.name=smallsteps

# Conexão com o banco de dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smallsteps}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:halka103}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Execução de scripts de inicialização (schema.sql e data.sql)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# JWT
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key

# Upload de Arquivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
